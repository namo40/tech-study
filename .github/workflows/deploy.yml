# Builds the static site and publishes it to GitHub Pages. The repository is
# private; only the built site is public, so nothing here reads the source at
# runtime. A pull request runs the build alone as a check: nothing is published
# until the change is on `main`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      # Reading the checkout and the Pages settings is all the build needs.
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # The build fetches the web fonts first and skips whatever is already on
      # disk, so a cache hit turns that step into a no-op. The key is the
      # script, because the script decides which files are asked for.
      - name: Cache the web fonts
        uses: actions/cache@v5
        with:
          path: public/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.mjs') }}

      - name: Type check
        run: npm run check

      - name: Verify scenes
        run: npm run verify

      - name: Build the site
        run: npm run build
        env:
          # The published site lives under a project sub-path, so canonical
          # URLs, `hreflang` links, and every asset path are built for it.
          SITE_URL: https://namo40.github.io
          SITE_BASE: /tech-study/

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    # A pull request stops after the build. Only `main` and a manual run reach
    # the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # `pages: write` creates the deployment; `id-token: write` mints the OIDC
      # token the Pages API checks it against.
      pages: write
      id-token: write
    # One deployment at a time, and a queued one waits for the run in flight
    # instead of cancelling it, so a half-published site is never left behind.
    # The group sits on this job rather than on the workflow so that a pull
    # request's build, which never gets here, cannot hold a deployment back.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
