# Builds the static site and publishes it to GitHub Pages. The repository is
# private; only the built site is public, so nothing here reads the source at
# runtime.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. A queued run waits for the one in flight instead of
# cancelling it, so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      # Reading the checkout and the Pages settings is all the build needs.
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Verify scenes
        run: npm run verify

      - name: Build the site
        run: npm run build
        env:
          # The published site lives under a project sub-path, so canonical
          # URLs, `hreflang` links, and every asset path are built for it.
          SITE_URL: https://namo40.github.io
          SITE_BASE: /tech-study/

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # `pages: write` creates the deployment; `id-token: write` mints the OIDC
      # token the Pages API checks it against.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
